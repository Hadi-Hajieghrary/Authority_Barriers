# Set A1: planar one-cable set for the 4-D kernel (E3); per-cable share of set A.
# omega_bar, rho, f_max are derived by authority_barriers.theory.params.derive_set with 5 % margins.
name: A1
N: 1
m_L: 0.25        # one cable carrying its share of set A
m: 1.5            # quadrotor mass [kg] (each)
l: 1.0            # cable length [m]
T_min: 1.0        # tension floor [N]
theta_q_deg: 20.0 # cable cone half-angle
z_bar_frac: 0.7   # z_bar = frac * sin(theta_q)
w_bar_frac: 0.5   # w_bar = frac * sin(theta_q)
nu: 0.5           # swing acceleration bound for z [1/s^2]
nu_w: 0.5
a_max: 12.0       # floor for the specific-force bound [m/s^2]; raised if D-4 consistency needs it
rho_fb: 1.0       # feedback reserve inside rho [N]
margin: 0.05
hover_margin: 1.2
kappa_H: 1.0
d_bar_L: 0.1   # D-16 revised: Rem. 18 needs nu_rob = nu - d_bar_i/(m l) - d_bar_L/(m_L l) > 0
d_bar_i: 0.3   # attitude error <= 0.15 N, wind <= 0.1 N, a_hat lag <= 0.05 N
